name: BOT BUILD - Flutter Debug, Release & Web2APK

on:
  workflow_dispatch:
    inputs:
      jobId:
        description: "Unique job ID from BOT BUILD"
        required: true
        type: string
      userId:
        description: "Telegram user ID"
        required: true
        type: string
      payload:
        description: "JSON payload (ZIP build or Web2APK)"
        required: true
        type: string

concurrency:
  group: botbuild-${{ github.event.inputs.jobId }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      JOB_ID: ${{ github.event.inputs.jobId }}
      TELEGRAM_USER_ID: ${{ github.event.inputs.userId }}
      PAYLOAD_JSON: ${{ github.event.inputs.payload }}
      GH_TOKEN: ${{ github.token }}
      TARGET_PLATFORMS: android-arm,android-arm64

    steps:
      - name: Checkout worker repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Validate dispatch payload
        id: payload
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -z "${PAYLOAD_JSON:-}" ]]; then
            echo "::error::Payload kosong."
            exit 1
          fi

          printf '%s' "$PAYLOAD_JSON" > payload.json
          if ! jq -e 'type == "object"' payload.json >/dev/null; then
            echo "::error::Payload bukan JSON object yang valid."
            exit 1
          fi

          MODE="$(jq -r '.mode // empty' payload.json)"
          if [[ -z "$MODE" ]]; then
            if jq -e 'has("appName") or has("iconUrl")' payload.json >/dev/null; then
              MODE="url"
            else
              MODE="zip"
            fi
          fi

          [[ "$MODE" == "zip" || "$MODE" == "url" ]] || {
            echo "::error::Mode tidak didukung: $MODE"
            exit 1
          }

          BUILD_TYPE="$(jq -r '.buildType // .build_type // "release"' payload.json)"
          [[ "$BUILD_TYPE" == "debug" || "$BUILD_TYPE" == "release" ]] || {
            echo "::error::Build type tidak valid: $BUILD_TYPE"
            exit 1
          }

          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "build_type=$BUILD_TYPE" >> "$GITHUB_OUTPUT"
          echo "Mode=$MODE | Build=$BUILD_TYPE | Job=$JOB_ID | User=$TELEGRAM_USER_ID"

      - name: Download Flutter/Android project ZIP
        if: steps.payload.outputs.mode == 'zip'
        shell: bash
        run: |
          set -Eeuo pipefail
          SOURCE_URL="$(jq -r '.zipAssetUrl // .url // empty' payload.json)"
          if [[ -z "$SOURCE_URL" || "$SOURCE_URL" == "null" ]]; then
            echo "::error::Payload ZIP tidak memiliki zipAssetUrl atau url."
            exit 1
          fi

          mkdir -p project_raw
          echo "Downloading source ZIP..."
          if [[ "$SOURCE_URL" == *"api.github.com/repos/"* ]]; then
            curl --fail --show-error --location --retry 3 --retry-all-errors \
              --connect-timeout 20 --max-time 300 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/octet-stream" \
              "$SOURCE_URL" -o project.zip
          else
            curl --fail --show-error --location --retry 3 --retry-all-errors \
              --connect-timeout 20 --max-time 300 \
              "$SOURCE_URL" -o project.zip
          fi

          test -s project.zip
          unzip -tq project.zip
          unzip -q project.zip -d project_raw
          echo "Source archive size: $(du -h project.zip | cut -f1)"

      - name: Generate full-screen Web2APK project
        if: steps.payload.outputs.mode == 'url'
        shell: bash
        run: |
          set -Eeuo pipefail
          WEB_URL="$(jq -r '.url // empty' payload.json)"
          APP_NAME="$(jq -r '.appName // "WebApp"' payload.json)"
          ICON_URL="$(jq -r '.iconUrl // empty' payload.json)"

          if [[ -z "$WEB_URL" ]]; then
            echo "::error::URL website kosong."
            exit 1
          fi
          python3 - "$WEB_URL" <<'PY'
          import sys
          from urllib.parse import urlparse
          u = urlparse(sys.argv[1])
          if u.scheme not in ("http", "https") or not u.netloc:
              raise SystemExit("URL harus diawali http:// atau https:// dan memiliki hostname.")
          PY

          python3 - "$APP_NAME" "$WEB_URL" <<'PY'
          import json, pathlib, re, sys
          app_name, web_url = sys.argv[1], sys.argv[2]
          safe = re.sub(r"[^a-z0-9_]+", "_", app_name.lower()).strip("_") or "webapp"
          if safe[0].isdigit():
              safe = "app_" + safe
          pathlib.Path("project_raw").mkdir(exist_ok=True)
          pathlib.Path("project_name.txt").write_text(safe)
          pathlib.Path("app_name.json").write_text(json.dumps(app_name, ensure_ascii=False))
          pathlib.Path("web_url.json").write_text(json.dumps(web_url, ensure_ascii=False))
          PY

          SAFE_NAME="$(cat project_name.txt)"
          flutter create --org com.youngit --project-name "$SAFE_NAME" \
            --platforms=android --no-pub "project_raw/$SAFE_NAME"

          cd "project_raw/$SAFE_NAME"
          flutter pub add webview_flutter
          mkdir -p assets

          # Generate Dart source using JSON-escaped constants to avoid quoting issues.
          python3 - "$APP_NAME" "$WEB_URL" <<'PY'
          import json, pathlib, sys
          app_name, web_url = sys.argv[1], sys.argv[2]
          source = r"""
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';
          import 'package:webview_flutter/webview_flutter.dart';

          const String appTitle = APP_TITLE;
          const String startUrl = START_URL;

          Future<void> main() async {
            WidgetsFlutterBinding.ensureInitialized();
            await SystemChrome.setEnabledSystemUIMode(SystemUiMode.immersiveSticky);
            await SystemChrome.setPreferredOrientations(const [
              DeviceOrientation.portraitUp,
              DeviceOrientation.landscapeLeft,
              DeviceOrientation.landscapeRight,
            ]);
            runApp(const Web2ApkApp());
          }

          class Web2ApkApp extends StatelessWidget {
            const Web2ApkApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: appTitle,
                debugShowCheckedModeBanner: false,
                theme: ThemeData(useMaterial3: true, colorSchemeSeed: Colors.blue),
                home: const WebHomePage(),
              );
            }
          }

          class WebHomePage extends StatefulWidget {
            const WebHomePage({super.key});

            @override
            State<WebHomePage> createState() => _WebHomePageState();
          }

          class _WebHomePageState extends State<WebHomePage>
              with WidgetsBindingObserver {
            late final WebViewController controller;
            bool loading = true;
            String? pageError;
            int progress = 0;

            @override
            void initState() {
              super.initState();
              WidgetsBinding.instance.addObserver(this);
              controller = WebViewController()
                ..setJavaScriptMode(JavaScriptMode.unrestricted)
                ..setBackgroundColor(const Color(0xFFFFFFFF))
                ..setNavigationDelegate(
                  NavigationDelegate(
                    onProgress: (value) {
                      if (!mounted) return;
                      setState(() {
                        progress = value;
                        loading = value < 100;
                      });
                    },
                    onPageStarted: (_) {
                      if (!mounted) return;
                      setState(() {
                        loading = true;
                        pageError = null;
                      });
                    },
                    onPageFinished: (_) {
                      if (!mounted) return;
                      setState(() {
                        loading = false;
                        pageError = null;
                      });
                    },
                    onWebResourceError: (error) {
                      if (!error.isForMainFrame || !mounted) return;
                      setState(() {
                        loading = false;
                        pageError = '${error.errorCode}: ${error.description}';
                      });
                    },
                    onHttpError: (error) {
                      if (!mounted) return;
                      if (error.response.statusCode >= 400) {
                        setState(() {
                          pageError = 'HTTP ${error.response.statusCode}';
                          loading = false;
                        });
                      }
                    },
                    onNavigationRequest: (request) {
                      final uri = Uri.tryParse(request.url);
                      if (uri == null) return NavigationDecision.prevent;
                      if (uri.scheme == 'http' || uri.scheme == 'https') {
                        return NavigationDecision.navigate;
                      }
                      return NavigationDecision.prevent;
                    },
                  ),
                )
                ..loadRequest(Uri.parse(startUrl));
            }

            @override
            void didChangeAppLifecycleState(AppLifecycleState state) {
              if (state == AppLifecycleState.resumed) {
                SystemChrome.setEnabledSystemUIMode(SystemUiMode.immersiveSticky);
              }
            }

            Future<bool> _handleBack() async {
              if (await controller.canGoBack()) {
                await controller.goBack();
                return false;
              }
              return true;
            }

            Future<void> _reload() async {
              setState(() {
                loading = true;
                pageError = null;
              });
              await controller.reload();
            }

            @override
            Widget build(BuildContext context) {
              return PopScope(
                canPop: false,
                onPopInvokedWithResult: (didPop, result) async {
                  if (didPop) return;
                  final canGoBack = await controller.canGoBack();
                  if (canGoBack) {
                    await controller.goBack();
                  } else if (mounted) {
                    await SystemNavigator.pop();
                  }
                },
                child: Scaffold(
                  backgroundColor: Colors.white,
                  body: Stack(
                    fit: StackFit.expand,
                    children: [
                      WebViewWidget(controller: controller),
                      if (loading && pageError == null)
                        Align(
                          alignment: Alignment.topCenter,
                          child: LinearProgressIndicator(
                            value: progress == 0 ? null : progress / 100,
                            minHeight: 2,
                          ),
                        ),
                      if (pageError != null)
                        ColoredBox(
                          color: Colors.white,
                          child: Center(
                            child: Padding(
                              padding: const EdgeInsets.all(24),
                              child: Column(
                                mainAxisSize: MainAxisSize.min,
                                children: [
                                  const Icon(Icons.wifi_off, size: 48),
                                  const SizedBox(height: 12),
                                  const Text(
                                    'Halaman tidak dapat dimuat',
                                    style: TextStyle(fontSize: 20, fontWeight: FontWeight.bold),
                                    textAlign: TextAlign.center,
                                  ),
                                  const SizedBox(height: 8),
                                  Text(pageError!, textAlign: TextAlign.center),
                                  const SizedBox(height: 20),
                                  FilledButton.icon(
                                    onPressed: _reload,
                                    icon: const Icon(Icons.refresh),
                                    label: const Text('Coba lagi'),
                                  ),
                                ],
                              ),
                            ),
                          ),
                        ),
                    ],
                  ),
                ),
              );
            }

            @override
            void dispose() {
              WidgetsBinding.instance.removeObserver(this);
              super.dispose();
            }
          }
          """
          source = source.replace("APP_TITLE", json.dumps(app_name, ensure_ascii=False))
          source = source.replace("START_URL", json.dumps(web_url, ensure_ascii=False))
          pathlib.Path("lib/main.dart").write_text(source)
          PY

          # Ensure Android internet permission and full-screen app theme.
          python3 - <<'PY'
          import pathlib, re
          p = pathlib.Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          if "android.permission.INTERNET" not in s:
              s = s.replace("<manifest", '<manifest\\n    xmlns:android="http://schemas.android.com/apk/res/android"', 1) if 'xmlns:android=' not in s else s
              s = s.replace("<application", '    <uses-permission android:name="android.permission.INTERNET"/>\\n    <application', 1)
          s = s.replace('android:usesCleartextTraffic="false"', 'android:usesCleartextTraffic="true"')
          if 'android:hardwareAccelerated="true"' not in s:
              s = s.replace("<application", '<application android:hardwareAccelerated="true"', 1)
          p.write_text(s)
          PY

          # Optional launcher icon. Failure is non-fatal; build still uses default icon.
          if [[ -n "$ICON_URL" ]]; then
            if [[ "$ICON_URL" == *"api.github.com/repos/"* ]]; then
              curl --fail --show-error --location --retry 2 --connect-timeout 20 --max-time 120 \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/octet-stream" "$ICON_URL" -o assets/app_icon.png || true
            else
              curl --fail --show-error --location --retry 2 --connect-timeout 20 --max-time 120 \
                "$ICON_URL" -o assets/app_icon.png || true
            fi
            if [[ -s assets/app_icon.png ]]; then
              flutter pub add --dev flutter_launcher_icons
              cat > flutter_launcher_icons.yaml <<'ICON'
          flutter_launcher_icons:
            android: true
            ios: false
            image_path: assets/app_icon.png
          ICON
              dart run flutter_launcher_icons || echo "::warning::Icon gagal dibuat; memakai icon default."
            else
              echo "::warning::Icon tidak dapat diunduh; memakai icon default."
            fi
          fi

          cd "$GITHUB_WORKSPACE"
          echo "Generated Web2APK project: project_raw/$SAFE_NAME"

      - name: Detect project structure
        id: detect
        shell: bash
        run: |
          set -Eeuo pipefail
          PUBSPEC="$(find project_raw -type f -name pubspec.yaml \
            -not -path '*/build/*' -not -path '*/.dart_tool/*' -print -quit)"
          if [[ -n "$PUBSPEC" ]]; then
            PROJECT_DIR="$(dirname "$PUBSPEC")"
            echo "type=flutter" >> "$GITHUB_OUTPUT"
            echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          GRADLEW="$(find project_raw -type f -name gradlew -not -path '*/build/*' -print -quit)"
          if [[ -n "$GRADLEW" ]]; then
            PROJECT_DIR="$(dirname "$GRADLEW")"
            echo "type=gradle" >> "$GITHUB_OUTPUT"
            echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          SETTINGS="$(find project_raw -type f \( -name settings.gradle -o -name settings.gradle.kts \) \
            -not -path '*/build/*' -print -quit)"
          if [[ -n "$SETTINGS" ]]; then
            PROJECT_DIR="$(dirname "$SETTINGS")"
            echo "type=gradle-no-wrapper" >> "$GITHUB_OUTPUT"
            echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "::error::ZIP tidak dikenali. Diperlukan pubspec.yaml atau project Android Gradle."
          find project_raw -maxdepth 4 -type f | head -100
          exit 1

      - name: Set up Gradle for project without wrapper
        if: steps.detect.outputs.type == 'gradle-no-wrapper'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Cache Flutter dependencies
        if: steps.detect.outputs.type == 'flutter'
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('project_raw/**/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Build Flutter APK
        if: steps.detect.outputs.type == 'flutter'
        working-directory: ${{ steps.detect.outputs.dir }}
        shell: bash
        env:
          BUILD_TYPE: ${{ steps.payload.outputs.build_type }}
        run: |
          set -Eeuo pipefail
          flutter config --no-analytics
          flutter pub get
          flutter build apk --"$BUILD_TYPE" \
            --target-platform="$TARGET_PLATFORMS" \
            --no-tree-shake-icons 2>&1 | tee build.log

      - name: Build native Android APK
        if: steps.detect.outputs.type != 'flutter'
        working-directory: ${{ steps.detect.outputs.dir }}
        shell: bash
        env:
          BUILD_TYPE: ${{ steps.payload.outputs.build_type }}
        run: |
          set -Eeuo pipefail
          if [[ "$BUILD_TYPE" == "debug" ]]; then TASK=assembleDebug; else TASK=assembleRelease; fi
          if [[ -f ./gradlew ]]; then
            chmod +x ./gradlew
            ./gradlew "$TASK" --no-daemon --stacktrace 2>&1 | tee build.log
          else
            gradle "$TASK" --no-daemon --stacktrace 2>&1 | tee build.log
          fi

      - name: Locate and validate APK
        id: locate
        if: success()
        shell: bash
        env:
          PROJECT_TYPE: ${{ steps.detect.outputs.type }}
          PROJECT_DIR: ${{ steps.detect.outputs.dir }}
          BUILD_TYPE: ${{ steps.payload.outputs.build_type }}
        run: |
          set -Eeuo pipefail
          APK=""
          if [[ "$PROJECT_TYPE" == "flutter" ]]; then
            APK="$(find "$PROJECT_DIR" -type f -name "app-${BUILD_TYPE}.apk" \
              -path '*/outputs/flutter-apk/*' -print -quit)"
          fi
          if [[ -z "$APK" ]]; then
            if [[ "$BUILD_TYPE" == "debug" ]]; then
              APK="$(find "$PROJECT_DIR" -type f -name '*debug*.apk' \
                -not -path '*/intermediates/*' -not -path '*/tmp/*' -print -quit)"
            else
              APK="$(find "$PROJECT_DIR" -type f -name '*release*.apk' \
                -not -path '*/intermediates/*' -not -path '*/tmp/*' -print -quit)"
            fi
          fi
          if [[ -z "$APK" || ! -s "$APK" ]]; then
            echo "::error::APK output tidak ditemukan atau kosong."
            find "$PROJECT_DIR" -type f -name '*.apk' -print || true
            exit 1
          fi
          SIZE="$(stat -c '%s' "$APK")"
          if (( SIZE < 1000 )); then
            echo "::error::APK terlalu kecil ($SIZE bytes)."
            exit 1
          fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "APK output valid: $APK ($(du -h "$APK" | cut -f1))"

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.event.inputs.jobId }}
          path: ${{ steps.locate.outputs.path }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 2

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics-${{ github.event.inputs.jobId }}
          path: |
            project_raw/**/build.log
            project_raw/**/pubspec.lock
            payload.json
          if-no-files-found: ignore
          retention-days: 3
